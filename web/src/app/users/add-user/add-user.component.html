<div class="add-user-container">
    <div class="header">
        <div class="title-section">
            <button class="back-btn" (click)="goBack()">
                <span>←</span> Back
            </button>
            <h1>Add New User</h1>
        </div>
        <p>Enter details to create a new user in the system.</p>
    </div>

    <div class="form-card">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" formControlName="username" placeholder="e.g. john_doe"
                    [class.invalid]="userForm.get('username')?.invalid && userForm.get('username')?.touched">
                <span class="error-text" *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched">
                    Valid username is required (min 2 characters)
                </span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" formControlName="email" placeholder="e.g. john@example.com"
                    [class.invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
                <span class="error-text" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
                    Valid email address is required
                </span>
            </div>

            <div *ngIf="error" class="alert error">
                {{ error }}
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-btn" (click)="goBack()" [disabled]="loading">Cancel</button>
                <button type="submit" class="submit-btn" [disabled]="userForm.invalid || loading">
                    <span *ngIf="!loading">Create User</span>
                    <span *ngIf="loading">Creating...</span>
                </button>
            </div>
        </form>
    </div>
</div>
