<div class="store-map-container">
  <!-- Header -->
  <div class="header glass-panel">
    <div class="title-area">
      <h1>Γ£¿ Store Architect 3D</h1>
      <p>Clean, fast, optimized multi-floor builder.</p>
    </div>
    <div class="header-actions">
      <button class="secondary-btn" (click)="toggleEditMode()">
        <span *ngIf="!editMode">Γ£Å∩╕Å Edit Mode</span>
        <span *ngIf="editMode">≡ƒæü∩╕Å View Mode</span>
      </button>
      <button class="primary-btn pulse-glow" (click)="openSetupModal()">
         ΓÜí Generate
      </button>
    </div>
  </div>

  <!-- Map Area -->
  <div class="layout-body" [class.editing]="editMode">
    
    <!-- Left Edit Toolbar -->
    <div class="edit-toolbar glass-panel" *ngIf="editMode">
      <div class="tool-section">
        <h3>Components</h3>
        <button class="tool-btn" (click)="spawnObject('stairs')">≡ƒ¬£ Stairs</button>
        <button class="tool-btn" (click)="spawnObject('block')">≡ƒôª Block</button>
        <button class="tool-btn" (click)="spawnObject('wall')">≡ƒº▒ Wall</button>
        <button class="tool-btn" (click)="spawnObject('machine')">ΓÜÖ∩╕Å Machine</button>
        <button class="tool-btn" (click)="spawnObject('plant')">≡ƒ¬┤ Plant</button>
      </div>
      <div class="tool-section mt-4">
        <h3>Controls</h3>
        <button class="tool-btn" [class.active]="transformMode === 'translate'" (click)="setTransformMode('translate')">Γÿ⌐ Move</button>
        <button class="tool-btn" [class.active]="transformMode === 'rotate'" (click)="setTransformMode('rotate')">Γå╗ Rotate</button>
        <button class="tool-btn" [class.active]="transformMode === 'scale'" (click)="setTransformMode('scale')">Γñó Scale</button>
      </div>

      <!-- Selected Object Properties - uses [hidden] to avoid *ngIf issues -->
      <div class="tool-section mt-4 selected-props" [hidden]="!hasSelection">
        <h3>≡ƒÄ» Selected Object</h3>
        <div class="prop-group">
          <label for="objNameInput">Name</label>
          <input id="objNameInput" type="text" class="prop-input" [(ngModel)]="selectedObjectName" (change)="updateObjectName()" placeholder="e.g. Clothing, Bakery">
        </div>
        <div class="prop-group">
          <label for="objColorInput">Color</label>
          <input id="objColorInput" type="color" class="prop-color" [(ngModel)]="selectedObjectColor" (input)="updateObjectColor()">
        </div>
        <div class="prop-actions">
          <button class="tool-btn" (click)="duplicateSelected()">≡ƒôï Duplicate</button>
          <button class="tool-btn delete-btn" (click)="deleteSelected()">≡ƒùæ∩╕Å Delete</button>
        </div>
      </div>
    </div>

    <!-- ThreeJS Canvas -->
    <div class="map-wrapper">
      <div class="canvas-container" #canvasContainer (pointerdown)="onCanvasPointerDown($event)" (pointerup)="onCanvasPointerUp($event)"></div>
      
      <!-- Setup Modal -->
      <div class="modal-overlay premium-modal" *ngIf="showSetupModal">
        <div class="modal-content glass-panel">
          <div class="modal-header">
             <h2>Γ£¿ Initialize Map</h2>
             <button class="close-btn" (click)="closeSetupModal()" [disabled]="isProcessing">Γ£ò</button>
          </div>
          
          <ng-container *ngIf="!isProcessing; else processingView">
            <div class="form-group mb-4">
              <label>Number of Floors</label>
              <input type="number" [(ngModel)]="numFloors" min="1" max="10" class="form-control" />
            </div>
            <div class="form-group mb-4 toggle-group">
              <label>Include Basement</label>
              <label class="switch">
                <input type="checkbox" [(ngModel)]="hasBasement">
                <span class="slider round"></span>
              </label>
            </div>
            <div class="modal-actions mt-4">
              <button class="btn-cancel" (click)="closeSetupModal()">Cancel</button>
              <button class="btn-submit pulse-glow" (click)="generateMap()">≡ƒÜÇ Build Fast</button>
            </div>
          </ng-container>

          <ng-template #processingView>
            <div class="processing-container">
              <div class="spinner"></div>
              <h3 class="gradient-text">Generating Empty Floors...</h3>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- Floor Navigation Controls -->
      <div class="floor-nav-panel glass-panel" *ngIf="totalLevels > 1 && !showSetupModal">
        <button class="nav-btn" [disabled]="activeFloorIndex === totalLevels - 1" (click)="moveFloorUp()">
          Γû▓<br><small>UP</small>
        </button>
        <div class="floor-indicator">
          <span class="level-name">{{ getActiveFloorName() }}</span>
        </div>
        <button class="nav-btn" [disabled]="activeFloorIndex === 0" (click)="moveFloorDown()">
          Γû╝<br><small>DN</small>
        </button>
      </div>
    </div>

  </div>
</div>
