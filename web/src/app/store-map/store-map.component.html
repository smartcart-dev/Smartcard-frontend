<div class="store-map-container">
  <!-- Header -->
  <div class="header glass-panel">
    <div class="title-area">
      <h1>✨ Store Architect 3D</h1>
      <p>Clean, fast, optimized multi-floor builder.</p>
    </div>
    <div class="header-actions">
      <button class="secondary-btn" (click)="toggleEditMode()">
         <span *ngIf="!storeState?.editMode">✏️ Edit Mode</span>
         <span *ngIf="storeState?.editMode">👁️ View Mode</span>
      </button>
      <button class="primary-btn pulse-glow" (click)="openSetupModal()">
         ⚡ Generate
      </button>
    </div>
  </div>

  <!-- Map Area -->
  <div class="layout-body" [class.editing]="storeState?.editMode">
    
    <!-- Left Edit Toolbar -->
    <div class="edit-toolbar glass-panel" *ngIf="storeState?.editMode">
      <div class="tool-section">
        <h3>Components</h3>
        <button class="tool-btn" (click)="spawnObject('stairs')">🪜 Stairs</button>
        <button class="tool-btn" (click)="spawnObject('block')">📦 Block</button>
        <button class="tool-btn" (click)="spawnObject('wall')">🧱 Wall</button>
        <button class="tool-btn" (click)="spawnObject('machine')">⚙️ Machine</button>
        <button class="tool-btn" (click)="spawnObject('plant')">🪴 Plant</button>
      </div>
      <div class="tool-section mt-4">
        <h3>Controls</h3>
        <button class="tool-btn" [class.active]="storeState?.transformMode === 'translate'" (click)="setTransformMode('translate')">☩ Move</button>
        <button class="tool-btn" [class.active]="storeState?.transformMode === 'rotate'" (click)="setTransformMode('rotate')">↻ Rotate</button>
        <button class="tool-btn" [class.active]="storeState?.transformMode === 'scale'" (click)="setTransformMode('scale')">⤢ Scale</button>
      </div>
    </div>

    <!-- ThreeJS Canvas -->
    <div class="map-wrapper">
      <div class="canvas-container" #canvasContainer (click)="onMouseClick($event)"></div>
      
      <!-- Setup Modal -->
      <div class="modal-overlay premium-modal" *ngIf="showSetupModal">
        <div class="modal-content glass-panel">
          <div class="modal-header">
             <h2>✨ Initialize Map</h2>
             <button class="close-btn" (click)="closeSetupModal()" [disabled]="isProcessing">✕</button>
          </div>
          
          <ng-container *ngIf="!isProcessing; else processingView">
            <div class="form-group mb-4">
              <label>Number of Floors</label>
              <input type="number" [(ngModel)]="numFloors" min="1" max="10" class="form-control" />
            </div>
            <div class="form-group mb-4 toggle-group">
              <label>Include Basement</label>
              <label class="switch">
                <input type="checkbox" [(ngModel)]="hasBasement">
                <span class="slider round"></span>
              </label>
            </div>
            <div class="modal-actions mt-4">
              <button class="btn-cancel" (click)="closeSetupModal()">Cancel</button>
              <button class="btn-submit pulse-glow" (click)="generateMap()">🚀 Build Fast</button>
            </div>
          </ng-container>

          <ng-template #processingView>
            <div class="processing-container">
              <div class="spinner"></div>
              <h3 class="gradient-text">Generating Empty Floors...</h3>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- Floor Navigation Controls -->
      <div class="floor-nav-panel glass-panel" *ngIf="storeState && storeState.floorsData.length > 1 && !showSetupModal">
        <button class="nav-btn" [disabled]="storeState.activeFloorIndex === storeState.floorsData.length - 1" (click)="moveFloorUp()">
          ▲<br><small>UP</small>
        </button>
        <div class="floor-indicator">
          <span class="level-name">{{ getActiveFloorName() }}</span>
        </div>
        <button class="nav-btn" [disabled]="storeState.activeFloorIndex === 0" (click)="moveFloorDown()">
          ▼<br><small>DN</small>
        </button>
      </div>
    </div>
    
    <!-- Right Properties Panel -->
    <div class="properties-panel glass-panel" *ngIf="storeState?.editMode && storeState?.hasSelection">
      <div class="panel-header">
        <h3>Properties</h3>
        <button class="close-btn" (click)="deselectObject()">✕</button>
      </div>

      <div class="form-group mb-4">
        <label>Name (e.g. Clothing, Bakery)</label>
        <input type="text" class="form-control" [(ngModel)]="selectedObjectName" (change)="updateObjectName()" placeholder="Component Name">
      </div>

      <div class="form-group mb-4" *ngIf="selectedObjectType === 'block' || selectedObjectType === 'wall'">
        <label>Color</label>
        <input type="color" class="color-picker" [(ngModel)]="selectedObjectColor" (input)="updateObjectColor()">
      </div>

      <div class="panel-actions mt-4">
        <button class="btn-duplicate" (click)="duplicateSelected()">📋 Duplicate</button>
        <button class="btn-delete" (click)="deleteSelected()">🗑️ Delete</button>
      </div>
    </div>

  </div>
</div>
