<div class="cart-container">
    <header class="cart-header">
        <button class="back-btn" (click)="goBack()">
            <span class="icon">←</span>
        </button>
        <h1>Barcode Scanner</h1>
    </header>

    <main class="cart-content">
        <!-- Scanner Overlay -->
        <div *ngIf="showScanner" class="scanner-overlay">
            <div class="scanner-box">
                <div class="scanner-wrapper">
                    <div id="interactive" class="viewport">
                        <!-- QuaggaJS will populate this element -->
                    </div>
                    <div class="scanner-viewfinder">
                        <div class="focus-area">
                            <div class="scan-line"></div>
                            <div class="focus-corners"></div>
                        </div>
                    </div>
                    <div *ngIf="errorMessage" class="error-overlay">
                        {{ errorMessage }}
                    </div>
                </div>
                <div class="scanner-actions">
                    <p>Align the barcode within the box</p>
                    <button class="cancel-btn" (click)="toggleScanner()">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Scanned Value Display -->
        <div class="display-container">
            <button class="main-scan-btn" (click)="toggleScanner()" *ngIf="!showScanner">
                <span class="icon">📷</span> Scan Now
            </button>

            <div *ngIf="scannedCode && !showScanner" class="value-card">
                <span class="label">Scanned Barcode Value:</span>
                <span class="value">{{ scannedCode }}</span>
                <button class="clear-btn" (click)="scannedCode = ''">Clear</button>
            </div>

            <div *ngIf="!scannedCode && !showScanner" class="empty-state">
                <p>No barcode scanned yet.</p>
            </div>
        </div>
    </main>
</div>
